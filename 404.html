<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Smart Syria | سوريا الذكية</title>
    
    <!-- Default OG tags (will be updated by script below based on route) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Smart Syria" />
    <meta property="og:locale" content="ar_SY" />
    <meta name="twitter:card" content="summary_large_image" />
    
    <script type="text/javascript">
      // Route-specific OG meta tags for social media crawlers
      (function() {
        var path = window.location.pathname.toLowerCase();
        var title, description, image, url;
        
        // Default values
        title = 'Smart Syria | سوريا الذكية';
        description = 'Smart Syria - Portal for Syria Gaming Lab, Talk Tech Bloom, and Micro-bots | عندما يجتمع الفكر والخبرة والدعم';
        image = 'https://smart-syria.org/images/logos/Cover.png';
        url = 'https://smart-syria.org/';
        
        // Route-specific overrides
        if (path.indexOf('talk-tech-bloom') !== -1) {
          title = 'TalkTech Bloom | Smart Syria';
          description = 'TalkTech Bloom - فعالية تفاعلية تهدف إلى تمكين الشابات ومساعدتهن على اكتشاف المسارات التقنية المختلفة';
          image = 'https://smart-syria.org/images/logos/Bloom-1.jpg';
          url = 'https://smart-syria.org/talk-tech-bloom';
        } else if (path.indexOf('syria-gaming-lab') !== -1) {
          title = 'Syria Gaming Lab | Smart Syria';
          description = 'Syria Gaming Lab - انضم إلى مختبر الألعاب السوري وكن جزءاً من صناعة الألعاب';
          image = 'https://smart-syria.org/images/logos/SY.png';
          url = 'https://smart-syria.org/syria-gaming-lab';
        } else if (path.indexOf('micro-bots') !== -1) {
          title = 'Micro Bots | Smart Syria';
          description = 'Micro Bots Team - فريق الروبوتات الصغيرة';
          image = 'https://smart-syria.org/images/logos/Micro-1.jpg';
          url = 'https://smart-syria.org/micro-bots';
        }
        
        // Write meta tags
        document.write('<meta property="og:title" content="' + title + '" />');
        document.write('<meta property="og:description" content="' + description + '" />');
        document.write('<meta property="og:image" content="' + image + '" />');
        document.write('<meta property="og:url" content="' + url + '" />');
        document.write('<meta property="og:image:width" content="1200" />');
        document.write('<meta property="og:image:height" content="630" />');
        document.write('<meta name="twitter:title" content="' + title + '" />');
        document.write('<meta name="twitter:description" content="' + description + '" />');
        document.write('<meta name="twitter:image" content="' + image + '" />');
        document.write('<meta name="twitter:url" content="' + url + '" />');
        document.write('<meta name="description" content="' + description + '" />');
        document.title = title;
      })();
    </script>
    
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // Set to 0 for root domain (smart-syria.org), use 1 for subdirectory (user.github.io/repo)
      var pathSegmentsToKeep = 0;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
